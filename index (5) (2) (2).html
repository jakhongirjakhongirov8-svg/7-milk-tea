<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>7 Milk Tea</title>
    <style>
        :root {
            --bg: #fff8f0;
            --card: #fff;
            --ink: #3b2a20;
            --mut: #8a7565;
            --ac: #c9825b;
            --ac2: #f4b6c2;
            --gr: #a8c686;
            --line: #f0e2d3;
            --sh: 0 8px 24px rgba(120, 80, 50, .12);
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #241a15;
                --card: #33251d;
                --ink: #f7eadd;
                --mut: #c2a993;
                --line: #4a3629;
                --sh: 0 8px 24px rgba(0, 0, 0, .4)
            }
        }

        :root[data-theme="dark"] {
            --bg: #241a15;
            --card: #33251d;
            --ink: #f7eadd;
            --mut: #c2a993;
            --line: #4a3629;
            --sh: 0 8px 24px rgba(0, 0, 0, .4)
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px);
            scroll-behavior: smooth
        }

        * {
            text-decoration: none;
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.55
        }

        h1,
        h2,
        h3 {
            font-family: Georgia, "Times New Roman", serif;
            margin: 0 0 .4em;
            line-height: 1.15
        }

        h1 {
            font-size: clamp(2.2rem, 7vw, 4.2rem)
        }

        h2 {
            font-size: clamp(1.7rem, 4.5vw, 2.6rem)
        }

        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px
        }

        header {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 20;
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--line)
        }

        .bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            gap: 10px
        }

        .logo {
            font-family: Georgia, serif;
            font-weight: 700;
            font-size: 1.15rem;
            cursor: pointer;
            white-space: nowrap
        }

        .logo span {
            color: var(--ac)
        }

        nav {
            display: flex;
            gap: 4px
        }

        nav a {
            padding: 8px 12px;
            border-radius: 99px;
            color: var(--ink);
            text-decoration: none;
            font-size: .95rem;
            cursor: pointer
        }

        nav a.on,
        nav a:hover {
            background: var(--ac);
            color: #fff
        }

        .tools {
            display: flex;
            gap: 8px
        }

        .ib {
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink);
            border-radius: 99px;
            height: 40px;
            min-width: 40px;
            padding: 0 12px;
            font-size: 1rem;
            cursor: pointer
        }

        .burger {
            display: none
        }

        @media(max-width:780px) {
            .burger {
                display: block
            }

            nav {
                display: none;
                position: absolute;
                top: 64px;
                left: 0;
                right: 0;
                flex-direction: column;
                background: var(--bg);
                padding: 10px 20px 16px;
                border-bottom: 1px solid var(--line)
            }

            nav.open {
                display: flex
            }
        }

        .btn {
            display: inline-block;
            border: 0;
            background: var(--ac);
            color: #fff;
            padding: 14px 26px;
            border-radius: 99px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--sh);
            text-decoration: none
        }

        .btn.alt {
            background: var(--card);
            color: var(--ink);
            border: 1px solid var(--line)
        }

        .page {
            display: none;
            animation: in .4s
        }

        .page.on {
            display: block
        }

        @keyframes in {
            from {
                opacity: 0;
                transform: translateY(12px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        .hero {
            display: grid;
            grid-template-columns: 1.1fr .9fr;
            gap: 30px;
            align-items: center;
            padding: 50px 0
        }

        @media(max-width:780px) {
            .hero {
                grid-template-columns: 1fr;
                text-align: center;
                padding: 30px 0
            }

            .hero .cta {
                justify-content: center
            }
        }

        .hero p {
            color: var(--mut);
            font-size: 1.1rem;
            max-width: 520px
        }

        .cta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 22px
        }

        .art {
            position: relative;
            aspect-ratio: 1;
            max-width: 420px;
            margin: auto;
            width: 100%;
            display: grid;
            place-items: center
        }

        .art:before {
            content: "";
            position: absolute;
            inset: 6%;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--ac2), var(--ac));
            opacity: .5;
            filter: blur(2px)
        }

        .cup {
            position: relative;
            font-size: clamp(120px, 30vw, 220px);
            animation: fl 4s ease-in-out infinite
        }

        @keyframes fl {
            50% {
                transform: translateY(-14px) rotate(3deg)
            }
        }

        .pill {
            position: absolute;
            background: var(--card);
            box-shadow: var(--sh);
            border-radius: 99px;
            padding: 8px 14px;
            font-size: .85rem;
            font-weight: 600
        }

        .sec {
            padding: 40px 0
        }

        .grid {
            display: grid;
            gap: 18px;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr))
        }

        .card {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 22px;
            padding: 20px;
            box-shadow: var(--sh)
        }

        .card .em {
            font-size: 3rem
        }

        .item {
            display: flex;
            flex-direction: column;
            gap: 6px;
            transition: transform .2s
        }

        .item:hover {
            transform: translateY(-4px)
        }

        .item .top {
            height: 110px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            font-size: 3.6rem
        }

        .price {
            font-weight: 700;
            color: var(--ac)
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 8px
        }

        .add {
            border: 0;
            background: var(--ink);
            color: var(--bg);
            width: 38px;
            height: 38px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer
        }

        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0 18px
        }

        .tabs button {
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink);
            padding: 9px 18px;
            border-radius: 99px;
            cursor: pointer;
            white-space: nowrap;
            font-size: .95rem
        }

        .tabs button.on {
            background: var(--ac);
            color: #fff;
            border-color: var(--ac)
        }

        .band {
            background: linear-gradient(120deg, var(--ac), #e39aa9);
            color: #fff;
            border-radius: 28px;
            padding: 36px 26px;
            text-align: center;
            margin: 30px 0
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 14px;
            text-align: center
        }

        .stats b {
            font-family: Georgia, serif;
            font-size: 2.2rem;
            display: block;
            color: var(--ac)
        }

        .two {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 26px;
            align-items: center
        }

        @media(max-width:780px) {
            .two {
                grid-template-columns: 1fr
            }
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px 14px;
            border-radius: 14px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink);
            font: inherit;
            margin-bottom: 12px
        }

        label {
            font-size: .9rem;
            color: var(--mut)
        }

        .rev {
            font-style: italic;
            color: var(--mut)
        }

        footer {
            border-top: 1px solid var(--line);
            margin-top: 40px;
            padding: 30px 0;
            color: var(--mut);
            text-align: center;
            font-size: .9rem
        }

        #drawer {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            width: min(400px, 100%);
            background: var(--bg);
            z-index: 40;
            box-shadow: -10px 0 30px rgba(0, 0, 0, .25);
            transform: translateX(105%);
            transition: .3s;
            display: flex;
            flex-direction: column;
            padding: calc(18px + env(safe-area-inset-top, 0px)) 18px calc(18px + env(safe-area-inset-bottom, 0px))
        }

        #drawer.open {
            transform: none
        }

        #lines {
            flex: 1;
            overflow: auto
        }

        .ln {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid var(--line)
        }

        .ln .n {
            flex: 1
        }

        .q button {
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer
        }

        .badge {
            background: var(--ac2);
            color: #3b2a20;
            border-radius: 99px;
            padding: 0 7px;
            font-size: .8rem;
            margin-left: 4px;
            font-weight: 700
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: calc(24px + env(safe-area-inset-bottom, 0px));
            transform: translate(-50%, 100px);
            background: var(--ink);
            color: var(--bg);
            padding: 12px 20px;
            border-radius: 99px;
            z-index: 50;
            transition: .3s
        }

        #toast.on {
            transform: translate(-50%, 0)
        }

        .desc {
            color: var(--mut);
            font-size: .82rem;
            line-height: 1.35
        }

        .hit {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #fff;
            color: #3b2a20;
            font-size: .72rem;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 99px
        }

        .item .top {
            position: relative
        }

        #ov {
            position: fixed;
            inset: 0;
            background: rgba(30, 15, 5, .45);
            z-index: 35;
            opacity: 0;
            pointer-events: none;
            transition: .3s
        }

        #ov.open {
            opacity: 1;
            pointer-events: auto
        }

        #ok {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: rgba(30, 15, 5, .55);
            display: none;
            place-items: center;
            padding: 20px
        }

        #ok.open {
            display: grid
        }

        #ok .card {
            max-width: 380px;
            text-align: center
        }

        .steps {
            counter-reset: s
        }

        .steps .card {
            position: relative;
            padding-top: 34px
        }

        .steps .card:before {
            counter-increment: s;
            content: counter(s);
            position: absolute;
            top: -14px;
            left: 20px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--ac);
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 700
        }

        .tools select {
            width: auto;
            margin: 0;
            padding: 0 8px;
            height: 40px;
            border-radius: 99px
        }

        .fav {
            position: absolute;
            top: 8px;
            right: 8px;
            border: 0;
            background: rgba(255, 255, 255, .88);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            cursor: pointer;
            font-size: 1rem;
            line-height: 1
        }

        #opt {
            position: fixed;
            inset: 0;
            z-index: 60;
            background: rgba(30, 15, 5, .55);
            display: none;
            place-items: center;
            padding: 20px
        }

        #opt.open {
            display: grid
        }

        #opt .card {
            width: 100%;
            max-width: 380px;
            max-height: 100%;
            overflow: auto
        }

        #drawer {
            overflow-y: auto
        }

        #lines {
            flex: 1 0 auto;
            min-height: 110px
        }

        .tools select {
            width: auto
        }

        #lg {
            font-weight: 700
        }

        .demo {
            background: var(--ac2);
            color: #3b2a20;
            text-align: center;
            font-size: .82rem;
            padding: 6px 12px
        }

        .img {
            width: 120px;
        }

        .img2 {
            width: 15px;
        }

        .img3 {
            width: 20px;
        }
    </style>
    <style>
        .cp {
            height: 100px;
            max-width: 90%;
            object-fit: contain;
            filter: drop-shadow(0 6px 8px rgba(80, 40, 10, .25))
        }

        .ci {
            height: 44px;
            width: 30px;
            object-fit: contain
        }

        .item {
            padding: 16px;
            gap: 8px
        }

        .item .top {
            height: 170px
        }

        .cp {
            height: 150px;
            width: auto;
            filter: drop-shadow(0 6px 8px rgba(80, 40, 10, .18))
        }

        svg.ci {
            height: 50px;
            width: auto
        }

        .ln .n small {
            display: block
        }

        .item h3 {
            min-height: 2.4em
        }

        .item .desc {
            min-height: 2.6em
        }

        .grid {
            gap: 22px
        }

        .item .add {
            width: 44px;
            height: 44px;
            font-size: 1.5rem
        }
    </style>
</head>

<body>
    <header>
        <div class="wrap bar">
            <div class="logo" data-go="home"><span>7 Milk Tea</span></div>
            <nav id="nav"><a data-go="home" data-t="n1"></a><a data-go="menu" data-t="n2"></a><a data-go="about"
                    data-t="n3"></a><a data-go="places" data-t="n4"></a><a data-go="contact" data-t="n5"></a></nav>
            <div class="tools"><button class="ib" id="lg" aria-label="Language">RU</button><button class="ib" id="th"
                    aria-label="Theme">🌗</button><button class="ib" id="cb" aria-label="Cart">🛒<span class="badge"
                        id="cn">0</span></button><button class="ib burger" id="bg" aria-label="Menu">☰</button></div>
        </div>
    </header>
    <main class="wrap">
        <section class="page" id="home">
            <div class="hero">
                <div>
                    <h1><span data-t="h1"></span> <span data-t="h2" style="color:var(--ac)"></span></h1>
                    <p data-t="hp"></p>
                    <div class="cta"><button class="btn" data-go="menu" data-t="b1"></button><button class="btn alt"
                            data-go="places" data-t="b2"></button></div>
                </div>
                <div class="art">
                    <div class="cup"><img class="img" src="picture_2d2814462c3545709ecf0c37a8397079.png" alt=""></div>
                </div>
            </div>
            <div class="sec">
                <h2 style="text-align:center" data-t="why"></h2>
                <div class="grid">
                    <div class="card">
                        <div class="em">🍃</div>
                        <h3 data-t="f1t"></h3>
                        <p data-t="f1d"></p>
                    </div>
                    <div class="card">
                        <div class="em">🥛</div>
                        <h3 data-t="f2t"></h3>
                        <p data-t="f2d"></p>
                    </div>
                    <div class="card">
                        <div class="em">🎚️</div>
                        <h3 data-t="f3t"></h3>
                        <p data-t="f3d"></p>
                    </div>
                </div>
            </div>
            <div class="sec">
                <h2 data-t="hits"></h2>
                <div class="grid" id="hits"></div>
            </div>
            <div class="band">
                <h2 data-t="bt"></h2><button class="btn alt" data-go="menu" data-t="b1"></button>
            </div>
        </section>
        <section class="page" id="menu">
            <div class="sec">
                <h2 data-t="n2"></h2>
                <p class="rev" data-t="mnote"></p><input id="q" data-p="search">
                <div class="tabs" id="tabs"></div>
                <div class="grid" id="mg"></div>
            </div>
        </section>
        <section class="page" id="about">
            <div class="sec two">
                <div>
                    <h2 data-t="n3"></h2>
                    <p data-t="ab1"></p>
                    <p data-t="ab2"></p><button class="btn" data-go="menu" data-t="b1"></button>
                </div>
                <div class="card" style="text-align:center">
                    <div style="font-size:7rem">🍵</div>
                </div>
            </div>
        </section>
        <section class="page" id="places">
            <div class="sec">
                <h2 data-t="n4"></h2>
                <div class="grid"><a class="card" href="https://yandex.com/maps/org/7_milk_tea/162572841706/"
                        target="_blank" rel="noopener">
                        <div class="em">📍</div>
                        <h3 data-t="city"></h3>
                        <p data-t="addr"></p>
                    </a></div>
            </div>
        </section>
